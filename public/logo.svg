<svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="circ">
      <circle cx="20" cy="20" r="18"/>
    </clipPath>
  </defs>

  <!-- Three equal segments: India saffron / UK navy / Sheffield gold -->
  <g clip-path="url(#circ)">
    <!-- India: top segment (-90° → 30°) -->
    <path d="M20,20 L20,2 A18,18 0 0,1 35.59,29 Z" fill="#FF9933"/>
    <!-- UK: bottom-right segment (30° → 150°) -->
    <path d="M20,20 L35.59,29 A18,18 0 0,1 4.41,29 Z" fill="#012169"/>
    <!-- Sheffield: bottom-left segment (150° → 270°) -->
    <path d="M20,20 L4.41,29 A18,18 0 0,1 20,2 Z" fill="#C8960C"/>
  </g>

  <!-- White divider lines -->
  <line x1="20" y1="20" x2="20" y2="2"      stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="20" y1="20" x2="35.59" y2="29"  stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="20" y1="20" x2="4.41" y2="29"   stroke="white" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Outer ring -->
  <circle cx="20" cy="20" r="18" fill="none" stroke="white" stroke-width="1.5"/>

  <!-- Inner white circle + initial -->
  <circle cx="20" cy="20" r="7.5" fill="white"/>
  <text x="20" y="24.5"
        text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-weight="700"
        font-size="11"
        fill="#1a1a1a">R</text>
</svg>

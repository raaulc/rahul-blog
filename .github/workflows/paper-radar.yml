name: Daily AI Paper Radar

on:
  schedule:
    - cron: '0 7 * * *'   # 07:00 UTC daily
  workflow_dispatch: {}    # allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  rank-papers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rank today's papers with Jev
        env:
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
        run: python3 scripts/paper_ranker.py

      - name: Commit and push if changed
        run: |
          git config user.name "paper-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/papers.json
          git diff --staged --quiet || git commit -m "Update AI paper radar ($(date -u +%Y-%m-%d))"
          git push
